[project]
name = "drones_comms_model"
version = "0.1.0"
description = "Pydantic message contracts for gimbal commands and drone acknowledgements"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["pydantic>=2.14.3,<3.0.0"]

[tool.poetry]
requires-poetry = ">=2.5.1,<3.0.0"
packages = [{ include = "drones_comms_model" }]

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
hypothesis = "^6.170.15"
mypy = "^2.4.1"
ruff = "^0.17.4"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["drones_comms_model", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
